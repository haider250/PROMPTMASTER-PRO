<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptMaster Pro - Offline</title>
    <meta name="theme-color" content="#3b82f6">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .offline-container {
            max-width: 500px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .offline-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .offline-icon svg {
            width: 40px;
            height: 40px;
            stroke: white;
            fill: none;
            stroke-width: 2;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .features {
            text-align: left;
            margin: 30px 0;
        }
        
        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        .feature-icon {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .feature-icon svg {
            width: 12px;
            height: 12px;
            stroke: white;
            fill: none;
            stroke-width: 3;
        }
        
        .retry-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }
        
        .retry-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .offline-status {
            margin-top: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 0.9rem;
        }
        
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.online {
            background: #10b981;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .cached-content {
            margin-top: 30px;
            text-align: left;
        }
        
        .cached-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .cached-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .cached-item h4 {
            margin-bottom: 5px;
            color: #fbbf24;
        }
        
        .cached-item p {
            font-size: 0.9rem;
            opacity: 0.8;
            margin: 0;
        }
        
        @media (max-width: 480px) {
            .offline-container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <svg viewBox="0 0 24 24">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
        </div>
        
        <h1>You're Offline</h1>
        <p>Don't worry! PromptMaster Pro works offline too. You can still access your cached prompts and continue working.</p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24">
                        <polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/>
                    </svg>
                </div>
                <span>View cached prompts</span>
            </div>
            
            <div class="feature">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14,2 14,8 20,8"/>
                    </svg>
                </div>
                <span>Continue editing prompts</span>
            </div>
            
            <div class="feature">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2v20m-7-7h14"/>
                    </svg>
                </div>
                <span>Sync when back online</span>
            </div>
        </div>
        
        <button class="retry-btn" onclick="retryConnection()">Retry Connection</button>
        <button class="retry-btn" onclick="goHome()">Go to Dashboard</button>
        
        <div class="offline-status">
            <div class="status-indicator" id="statusIndicator"></div>
            <span id="statusText">Checking connection...</span>
        </div>
        
        <div class="cached-content" id="cachedContent">
            <h3 style="margin-bottom: 15px;">Available Offline</h3>
            <!-- Cached content will be populated here -->
        </div>
    </div>
    
    <script>
        let isOnline = navigator.onLine;
        
        function updateStatus() {
            const indicator = document.getElementById('statusIndicator');
            const text = document.getElementById('statusText');
            
            if (navigator.onLine) {
                indicator.classList.add('online');
                text.textContent = 'Back online! Syncing data...';
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            } else {
                indicator.classList.remove('online');
                text.textContent = 'Still offline';
            }
        }
        
        function retryConnection() {
            if (navigator.onLine) {
                window.location.href = '/';
            } else {
                // Try to fetch a small resource to test connection
                fetch('/', { method: 'HEAD', mode: 'no-cors' })
                    .then(() => {
                        window.location.href = '/';
                    })
                    .catch(() => {
                        alert('Still no connection. Please check your network and try again.');
                    });
            }
        }
        
        function goHome() {
            window.location.href = '/';
        }
        
        function loadCachedContent() {
            // Load cached prompts and content
            if ('serviceWorker' in navigator && 'caches' in window) {
                caches.keys().then(cacheNames => {
                    cacheNames.forEach(cacheName => {
                        caches.open(cacheName).then(cache => {
                            cache.keys().then(requests => {
                                requests.forEach(request => {
                                    if (request.url.includes('/api/prompts')) {
                                        cache.match(request).then(response => {
                                            if (response) {
                                                response.json().then(data => {
                                                    addCachedItem(data);
                                                });
                                            }
                                        });
                                    }
                                });
                            });
                        });
                    });
                });
            }
        }
        
        function addCachedItem(data) {
            const container = document.getElementById('cachedContent');
            
            if (data && data.length > 0) {
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'cached-item';
                    div.innerHTML = `
                        <h4>${item.title || 'Untitled Prompt'}</h4>
                        <p>${item.content ? item.content.substring(0, 100) + '...' : 'No content available'}</p>
                    `;
                    div.onclick = () => {
                        if (item.id) {
                            window.location.href = `/prompt/${item.id}`;
                        }
                    };
                    container.appendChild(div);
                });
            }
        }
        
        // Event listeners
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        
        // Initial status check
        updateStatus();
        loadCachedContent();
        
        // Periodic status check
        setInterval(updateStatus, 5000);
        
        // Register service worker if not already registered
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log('Service Worker registered in offline page:', registration);
                })
                .catch(error => {
                    console.log('Service Worker registration failed:', error);
                });
        }
    </script>
</body>
</html>
